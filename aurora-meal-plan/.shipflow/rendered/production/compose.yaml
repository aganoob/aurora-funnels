services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  production-web:
    image: ${PRODUCTION_IMAGE:?Set PRODUCTION_IMAGE to an immutable image digest}
    env_file: /etc/shipflow/production/production.env
    restart: unless-stopped
    mem_limit: 768m
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  production-postgres:
    image: postgres:16-alpine
    env_file: /etc/shipflow/production/production.env
    restart: unless-stopped
    mem_limit: 1024m
    volumes: ["production-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipflow -d shipflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  production-worker:
    image: ${PRODUCTION_IMAGE:?Set PRODUCTION_IMAGE to an immutable image digest}
    command: ["node", "server.js"]
    env_file: /etc/shipflow/production/production.env
    environment:
      SHIPFLOW_DELIVERY_WORKER: "true"
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      production-web:
        condition: service_healthy
      production-postgres:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
  production-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/disks/shipflow-postgres/production
